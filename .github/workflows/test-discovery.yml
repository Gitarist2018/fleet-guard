name: Test Docker Discovery

on:
  push:
    paths:
      - "scripts/discover_compose_projects.py"
      - "tests/test_discover_compose_projects.py"
      - ".github/workflows/test-discovery.yml"
  pull_request:
    paths:
      - "scripts/discover_compose_projects.py"
      - "tests/test_discover_compose_projects.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m py_compile scripts/discover_compose_projects.py
      - name: Offline safety tests
        run: python -m unittest discover -s tests -v
